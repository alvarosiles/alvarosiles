name: Metrics

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Lenguajes, herramientas y comandos de todos mis commits (todos los repos y ramas)
        run: python3 .github/scripts/languages.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Estadísticas y rachas
        run: python3 .github/scripts/stats.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/languages.svg metrics/tech.svg metrics/stats.svg metrics/streak.svg
          git diff --cached --quiet || { git commit -m "Update metrics cards - [Skip GitHub Action]" && git push; }

      - name: Resumen general (repos públicos, privados y de organizaciones)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: alvarosiles
          base: header, activity, community, repositories, metadata
          config_timezone: America/La_Paz
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_batch: 25
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            .items-wrapper { background: #0d1117; border-radius: 4.5px; padding: 6px 0 4px; }
            svg { color: #c9d1d9; }
            h1, h2, h3 { color: #58a6ff; }
            .field svg { fill: #8b949e; }
            footer { color: #8b949e; }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(240,246,252,0.05);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }
            .calendar .day { outline: 1px solid rgba(240,246,252,0.05); }
            [fill="#ebedf0"] { fill: #161b22; }
            [fill="#9be9a8"] { fill: #0e4429; }
            [fill="#40c463"] { fill: #006d32; }
            [fill="#30a14e"] { fill: #26a641; }
            [fill="#216e39"] { fill: #39d353; }
