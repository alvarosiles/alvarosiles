# Actualiza las tarjetas de metrics/ una vez al día (06:00 en Bolivia).
# Los scripts de .github/scripts generan cada tarjeta en español e inglés;
# lowlighter/metrics genera metrics/general.svg (actividad y calendario).
name: Metrics

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Lenguajes, herramientas y comandos (todos los repos y ramas)
        run: python3 .github/scripts/languages.py

      - name: Estadísticas y rachas
        run: python3 .github/scripts/stats.py

      - name: Badges
        run: python3 .github/scripts/badges.py

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update metrics cards - [Skip GitHub Action]"
          # Si alguien subió cambios mientras corría la acción, se integran antes de subir
          git pull --rebase
          git push

      - name: Actividad general (repos públicos, privados y de organizaciones)
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics/general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: alvarosiles
          base: header, activity, community, repositories, metadata
          config_timezone: America/La_Paz
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_batch: 25
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Mismos colores que las demás tarjetas (tema oscuro de GitHub)
          extras_css: |
            svg.large { background: #0d1117; border-radius: 4.5px; }
            .items-wrapper { padding: 6px 0 4px; }
            svg { color: #c9d1d9; }
            h1, h2, h3 { color: #58a6ff; }
            .field svg { fill: #8b949e; }
            footer { color: #8b949e; }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(240,246,252,0.05);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }
            .calendar .day { outline: 1px solid rgba(240,246,252,0.05); }
            [fill="#ebedf0"] { fill: #161b22; }
            [fill="#9be9a8"] { fill: #0e4429; }
            [fill="#40c463"] { fill: #006d32; }
            [fill="#30a14e"] { fill: #26a641; }
            [fill="#216e39"] { fill: #39d353; }
