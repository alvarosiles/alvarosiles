name: Metrics

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Lenguajes de todos mis commits (todos los repos y ramas)
        run: python3 .github/scripts/languages.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Guardar tarjeta de lenguajes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/languages.svg
          git diff --cached --quiet || { git commit -m "Update metrics/languages.svg - [Skip GitHub Action]" && git push; }

      - name: Resumen general (repos públicos, privados y de organizaciones)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: alvarosiles
          base: header, activity, community, repositories, metadata
          config_timezone: America/La_Paz
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_batch: 25
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
